<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>工地管家 Prototype</title>

<style>

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Noto Sans TC',system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#app{max-width:430px;margin:auto;padding:8px 16px}
button,input,textarea{font:inherit;color:inherit}h1{margin:4px 0;font-size:28px;font-weight:900}h2{font-size:19px;margin:16px 0 8px}
.card{display:block;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:8px 0}

.t{min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0;width:100%}.t b{font-size:30px}
.red{background:var(--rbg);border-color:var(--red);color:var(--red)}

.tabs{display:flex;overflow-x:auto;margin:8px -16px;background:var(--card);border-bottom:1px solid var(--ln)}.tabs button{flex:none;min-height:48px;padding:0 16px;border:0;background:none;font-size:16px;color:var(--sub)}.tabs .on{color:var(--pri);font-weight:700;border-bottom:3px solid var(--pri)}
.bar{display:flex;gap:4px;margin:6px 0 10px}.bar i{flex:1;height:8px;border-radius:4px;background:var(--ln)}.bar .f{background:var(--pri)}
.fab{position:fixed;right:max(16px,calc(50% - 199px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:auto;padding:0 24px;border-radius:30px;box-shadow:0 2px 8px #0005}
.mod{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}.mod>div{background:var(--bg);width:100%;max-width:430px;padding:16px;border-radius:16px 16px 0 0;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1F2A2E;color:#fff;padding:10px 16px;border-radius:20px;font-size:15px;display:none;z-index:10;max-width:90%}
.tl{display:flex;gap:10px;min-height:52px}.tl i{width:12px;height:12px;border-radius:6px;background:var(--pri);margin-top:7px;flex:none}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=i=>document.getElementById(i),f=n=>'＄'+Math.round(n).toLocaleString('en-US'),P1=n=>(Math.round(n*100)/100).toFixed(2);
const A2=r=>r.l*r.w/10000,PJ=r=>A2(r)/3.305785,tp=c=>c.rooms.reduce((s,r)=>s+PJ(r),0),wq=T=>Math.ceil(T*1.07-1e-9),sm=I=>I.reduce((a,i)=>({a:a.a+i.q*i.p,c:a.c+i.c}),{a:0,c:0}),ur=c=>c.pay.reduce((s,p)=>s+p.d-p.p,0);
const dt=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return(d.getMonth()+1)+'/'+d.getDate()+'週'+'日一二三四五六'[d.getDay()]},tm=()=>{const d=new Date();return(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const FS={a:['待丈量'],b:['已丈量','待報價'],c:['已成交','待施工'],d:['施工中'],e:['待收款']},PC=['現場全景','地坪','門框','踢腳板','特殊狀況','其他'],RN=['客廳','主臥','次臥','書房','餐廳','走道','其他'],US=['阿化','阿興','阿章','阿亮','阿芳'];
let U='阿化',V='home',cid=null,ct='摘要',qm='明細',DR=null,RS='調整材料',W=null,FL=null,CK=false,PS=null,NC={},AI='補收邊條',CU=[],CWO=0,D=seed();
const M=()=>['阿化','阿興'].includes(U),C=()=>D.find(c=>c.id==cid),lg=(c,e)=>c.log.unshift({t:tm(),by:U,e});
const chip=(t,fn,on)=>`<button class="chip${on?' on':''}" onclick="${fn}">${t}</button>`,btn=(t,fn,x='',d=0)=>`<button class="b ${x}" onclick="${fn}"${d?' disabled':''}>${t}</button>`,back=(t,fn)=>`<button style="border:0;background:none;color:var(--pri);font-weight:700;min-height:44px;padding:0" onclick="${fn}">‹ ${t}</button>`;
const tst=m=>{const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(tst.t);tst.t=setTimeout(()=>e.style.display='none',2400)};
function bq(c){const T=tp(c),m=wq(T),s=Math.ceil(T),r=c.rooms,I=[['材料',m,'坪',2600,m*1900],['施工',s,'坪',1200,s*800]];
if(r.some(x=>x.old&&x.old!='不拆'))I.push(['拆除',s,'坪',300,s*200]);if(r.some(x=>x.wk.includes('打黑底料')))I.push(['黑底料',1,'式',8000,5500]);if(r.some(x=>x.wk.includes('收邊')))I.push(['收邊條',12,'支',250,2000]);I.push(['運費',1,'式',4400,1500]);return I.map(([n,q,u,p,c])=>({n,q,u,p,c}))}
function mkp(c,a){const x=Math.round(a*.4),y=Math.round(a*.5);c.pay=[['訂金',x],['完工款',y],['尾款',a-x-y]].map(([n,d])=>({n,d,p:0,dt:'',how:'',note:''}))}
function sy(c){if(c.done)c.st=ur(c)<=0?'已結案':'待收款'}
function seed(){const R=(n,l,w,k)=>({n,l,w,fl:[],old:'拆除',wk:k,note:''}),rooms=()=>[R('客廳',640,460,['打黑底料','門框處理','收邊']),R('主臥',420,380,[]),R('次臥',360,340,[]),R('書房',300,240,[])];
const mk=(o)=>Object.assign({tel:'',line:'',date:'',crew:[],note:'',rooms:[],ph:[],q:[],deal:null,pay:[],as:[],done:null,dd:0,dn:'',log:[]},o);
const a=mk({id:1,cu:1,name:'陳先生',tel:'0900-000-000',line:'chen88',addr:'新店住家',src:'設計師介紹',mat:'SPC 卡扣地板',st:'已丈量',rooms:rooms(),log:[{t:'9/30 15:20',by:'阿化',e:'完成丈量　19.6 坪'},{t:'9/28 10:05',by:'阿化',e:'建立案件'}]});
const b=mk({id:2,cu:2,name:'黃先生',tel:'0911-111-111',addr:'內湖住家',src:'舊客戶',mat:'超耐磨木地板',st:'待收款',rooms:rooms(),date:'9/22',crew:['阿章'],done:'9/24',dd:12,q:[{v:1,t:'9/2 10:00',amt:100000,why:'初版',by:'阿化',items:bq({rooms:rooms()})}],deal:100000,log:[{t:'9/24 17:30',by:'阿興',e:'完工'},{t:'9/12 11:00',by:'阿興',e:'收訂金　＄40,000'},{t:'9/2 10:00',by:'阿化',e:'建立報價 V1'}]});mkp(b,100000);b.pay[0].p=40000;b.pay[0].dt='9/12';b.pay[0].how='轉帳';b.pay[1].p=50000;b.pay[1].dt='9/24';b.pay[1].how='現金';
CU=[{id:1,name:'陳先生',tel:'0900-000-000',line:'chen88'},{id:2,name:'黃先生',tel:'0911-111-111',line:''},{id:3,name:'林先生',tel:'0922-222-222',line:''},{id:4,name:'王先生',tel:'0933-333-333',line:'wang33'}];
const w1=mk({id:4,cu:4,name:'王先生',tel:'0933-333-333',line:'wang33',addr:'中和○○路住家',src:'舊客戶',mat:'SPC 卡扣地板',st:'已結案',rooms:[R('客廳',900,771,[])],date:'8/18',crew:['阿章'],done:'8/20',log:[{t:'8/20 17:00',by:'阿興',e:'完工'},{t:'8/1 10:00',by:'阿化',e:'建立案件'}]});w1.q=[{v:1,t:'8/1 11:00',amt:sm(bq(w1)).a,why:'初版',by:'阿化',items:bq(w1)}];w1.deal=w1.q[0].amt;mkp(w1,w1.deal);w1.pay.forEach(p=>{p.p=p.d;p.dt='8/20';p.how='轉帳'});
const w2=mk({id:5,cu:4,name:'王先生',tel:'0933-333-333',line:'wang33',addr:'板橋○○路辦公室',src:'舊客戶',mat:'PVC 塑膠地板',st:'待報價',rooms:[R('其他',1000,1160,[])],log:[{t:'10/3 14:00',by:'阿化',e:'建立案件'}]});
return[a,b,mk({id:3,cu:3,name:'林先生',tel:'0922-222-222',addr:'板橋住家',src:'統包',mat:'PVC 塑膠地板',st:'待丈量',log:[{t:'10/5 09:00',by:'阿化',e:'建立案件'}]}),w1,w2]}
function R(){const y=scrollY,B={home:'home',cust:'cust',cases:'cases',case:'cases',wiz:'cases',new:'cases',quotes:'quotes',cq:'quotes',more:'more'}[V],N=[['home','首頁'],['cust','客戶'],['cases','案件'],['quotes','報價'],['more','更多']];
$('app').innerHTML=({home:vHome,cust:vCust,cases:vCases,quotes:vQuotes,more:vMore,case:vCase,wiz:vWiz,new:vNew,cq:vCQ})[V]()+(V=='wiz'?'':`<div class="nav">${N.map(([k,t])=>`<button class="${k==B?'on':''}" onclick="go('${k}')">${t}</button>`).join('')}</div>`)+(PS?vPS():'');scrollTo(0,y)}
const go=v=>{V=v;FL=null;cid=null;PS=null;R();scrollTo(0,0)},fl=k=>{V='cases';FL=FS[k];R();scrollTo(0,0)},op=(id,t='摘要')=>{cid=id;V='case';ct=t;DR=null;CK=false;R();scrollTo(0,0)};
const row=(c,a,b,x='',t='摘要')=>`<button class="card ${x}" style="width:100%;text-align:left;min-height:64px" onclick="op(${c.id},'${t}')"><div class="row"><span><b style="font-size:18px">${a}</b><br><span class="sub" style="color:inherit">${b}</span></span><b style="font-size:22px">›</b></div></button>`;
function vHome(){const g=k=>D.filter(c=>FS[k].includes(c.st)),ar=g('e'),T=(n,l,k,x='',s='')=>`<div style="${s}"><button class="card t ${x}" onclick="fl('${k}')"><b>${n}</b><span>${l}</span></button></div>`;
let r='';g('b').forEach(c=>r+=row(c,'尚未報價',c.name+'・'+c.addr,'','報價'));D.filter(c=>['已成交','待施工'].includes(c.st)).forEach(c=>r+=row(c,'即將施工',(c.date||'日期未排')+'　'+c.name+(c.crew.length?'':'・待認領'),'','施工'));ar.forEach(c=>r+=row(c,'待收款・完工尾款未收',`${c.name}・完工 ${c.dd} 天・未收 ${f(ur(c))}`,'red','收款'));D.filter(c=>c.as.some(a=>!a.dt)).forEach(c=>r+=row(c,'售後案件',c.name+'・'+c.as.find(a=>!a.dt).issue,'','售後'));
return`<div class="sub">${dt()}・範例資料・${U}</div><h1>今天</h1><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">${T(g('a').length,'待丈量','a')}${T(g('b').length,'待報價','b')}${T(g('c').length,'待施工','c')}${T(g('d').length,'施工中','d')}${T(ar.length+' 案　'+f(ar.reduce((s,c)=>s+ur(c),0)),'待收款','e','red','grid-column:span 2')}</div><h2>需要處理</h2>${r||'<div class="card">都處理完了</div>'}${M()?btn('＋ 新增案件',"NC={};V='new';R()",'fab'):''}`}
function vCases(){const L=D.filter(c=>!FL||FL.includes(c.st));return`<h1>案件</h1>${FL?`<button class="chip on" onclick="FL=null;R()">篩選：${FL.join('、')} ✕</button>`:''}${L.map(c=>row(c,c.name+'・'+c.addr,c.st+(c.date?'・施工 '+c.date:''),c.st=='待收款'?'red':'')).join('')||'<div class="card">沒有案件</div>'}${M()?btn('＋ 新增案件',"NC={};V='new';R()",'fab'):''}`}
function vCust(){return'<h1>客戶</h1>'+CU.map(u=>{const a=D.filter(c=>c.cu==u.id);return`<button class="card" style="width:100%;text-align:left" onclick="${a.length?`op(${a[0].id})`:''}"><div class="row"><b style="font-size:19px">${u.name}</b><span class="tag">${a.length} 個案件</span></div><div class="sub">${u.tel||'—'}・${a.map(c=>c.addr).join('、')||'尚無案件'}</div></button>`}).join('')}
function vQuotes(){return`<h1>報價</h1>`+D.map(c=>row(c,c.name+'・'+c.addr,c.q.length?`V${c.q[0].v}　${f(c.q[0].amt)}（未稅）`:'尚未報價','','報價')).join('')}
function vMore(){return`<h1>更多</h1><h2>目前使用者（測試權限用）</h2><div class="w">${US.map(u=>chip(u+(['阿化','阿興'].includes(u)?'（管理者）':'（師傅）'),`U='${u}';R()`,u==U)).join('')}</div><div class="card sub" style="margin-top:12px">${M()?'管理者：可編輯全部資料，看得到成本、利潤、毛利率。':'師傅：可查看案件、丈量、照片、施工、收款，可上傳照片、按「我來接」；看不到成本利潤，也不能改報價與收款。'}</div>${btn('重設範例資料',"D=seed();cid=null;V='home';R();tst('已重設')",'b2')}<div class="sub">Prototype：資料只存在這個頁面，重新整理會恢復範例。</div>`}
function vNew(){const ch=(k,a)=>`<div class="w">${a.map(x=>chip(x,`NC.${k}='${x}';R()`,NC[k]==x)).join('')}</div>`,cu=CU.find(x=>x.id==NC.cu);return back('取消',"go('cases')")+`<h1>新增案件</h1><div class="sub">選擇客戶</div><select class="sm" onchange="NC.cu=this.value;R()"><option value="">＋ 新客戶（輸入資料）</option>${CU.map(x=>`<option value="${x.id}" ${NC.cu==x.id?'selected':''}>${x.name}</option>`).join('')}</select>`+(cu?`<div class="card"><b>${cu.name}</b><br>電話：${cu.tel||'—'}　LINE：${cu.line||'—'}<div class="sub">已自動帶入客戶資料</div></div>`:`<div class="sub" style="margin-top:8px">客戶姓名</div><input class="sm" value="${NC.name||''}" oninput="NC.name=this.value"><div class="sub" style="margin-top:8px">電話</div><input class="sm" type="tel" value="${NC.tel||''}" oninput="NC.tel=this.value">`)+`<div class="sub" style="margin-top:8px">案場地址或區域</div><input class="sm" value="${NC.addr||''}" oninput="NC.addr=this.value"><h2>案件來源</h2>${ch('src',['舊客戶','統包','設計師介紹','其他工種師傅介紹'])}<h2>想做的材質</h2>${ch('mat',['SPC','PVC 塑膠地板','塑膠地磚','超耐磨木地板','卡扣式地板'])}${btn('建立案件',"nc()")}`}
function nc(){let u=CU.find(x=>x.id==NC.cu);if(!u){const n=(NC.name||'').trim();if(!n)return tst('請填客戶姓名');if(CU.some(x=>x.name==n))return tst('這位客戶已經存在，請從「選擇客戶」下拉選單選');u={id:Date.now(),name:n,tel:NC.tel||'',line:''};CU.push(u)}
const c={id:Date.now()+1,cu:u.id,name:u.name,tel:u.tel,line:u.line,addr:NC.addr||'未填',src:NC.src||'其他',mat:NC.mat||'未選',st:'待丈量',date:'',crew:[],note:'',rooms:[],ph:[],q:[],deal:null,pay:[],as:[],done:null,dd:0,dn:'',log:[]};lg(c,'建立案件');D.unshift(c);op(c.id)}
function vCase(){const c=C(),tb=['摘要','丈量','照片','報價','施工','收款','售後','紀錄'],F={摘要:tS,丈量:tM,照片:tP,報價:tQ,施工:tC,收款:tPay,售後:tA,紀錄:tL};
return back('案件',"go('cases')")+`<div class="row"><h1>${c.name}</h1><span class="tag">${c.st}</span></div><a class="b b2" style="display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:48px;font-size:17px" href="tel:${c.tel}">撥打 ${c.tel||'（無電話）'}</a><div class="sub" style="margin-top:6px">案場：${c.addr}　施工：${c.date||'未排'}　人員：${c.crew.join('、')||'待認領'}</div><div class="tabs">${tb.map(t=>`<button class="${t==ct?'on':''}" onclick="ct='${t}';DR=null;CK=false;R()">${t}</button>`).join('')}</div>`+F[ct](c)}
